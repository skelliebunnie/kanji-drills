<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kanji Drill Sheet Generator</title>
	
	<link rel="stylesheet" href="/src/styles/reset.css">
	<link rel="stylesheet" href="/src/styles/layout.css">
	<link rel="stylesheet" href="/src/styles/general.css">
</head>
<body>
	<div class="page-wrapper">
		<header class="site-header"><h1>Kanji Drill Sheet Generator</h1></header>
		<div class="options-wrapper">
			<h3 class="title">Options <div id="toggle-options"><i data-lucide="chevron-up"></i></div></h3>
			<form id="options">
				<label for="reps">Reps (1-16):
					<input type="number" id="reps" placeholder="4" value="4" min="1" max="16">
				</label>
				<label class="radio-check"><input type="checkbox" id="example-sentences" checked> Include Example sentences</label>
				<label class="radio-check"><input type="checkbox" id="related-words"> Include Related Words</label>
				<label class="radio-check"><input type="checkbox" id="en-gloss" checked> Include English glosses</label>
				<label class="radio-check"><input type="checkbox" id="kanji-only"> Kanji Only</label>
				<label class="radio-check"><input type="checkbox" id="stroke-order"> Stroke Order</label>
			</form>
		</div>
		<main class="site-content">
			<div id="sheet">
				
			</div>
		</main>
		
		<aside class="site-sidebar">
			<div class="collection-container">
				<h2>Collection (<span id="count">0</span>)</h2>
				<div id="collection"></div>
			</div>
			<div class="search">
				<form role="search" id="search-form">
					<input type="search" id="query" placeholder="食べる、たべる、食、or &quot;eat&quot;" autocomplete="off" disabled>
				</form>
				<div id="status">Loading...</div>
				<div id="results"></div>
			</div>
		</aside>
		
		<footer class="site-footer">
			<p>Built by SkellieBunnie, based on a generator by <a href="https://github.com/jensechu/kanji" target="_blank" rel="noopener noreferrer">jensechu/kanji</a></p>
		</footer>
	</div>
	
	<!-- <script src="./src/scripts/options.js"></script> -->
	<script src="./src/scripts/app.js"></script>

	<script src="https://unpkg.com/lucide@1.69.0/dist/umd/lucide.min.js"></script>
	<script>
		lucide.createIcons();
	</script>
</body>
</html>
